name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify Docker
        run: docker --version
      
      - name: Verify Docker Compose
        run: docker compose --version