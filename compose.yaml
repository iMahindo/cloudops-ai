services:
  #APP CONFIG
  app:
    build:
      context: .
    container_name: cloudops-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
  #QDRANT CONFIG
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: cloudops-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
  #PROMETHEUS CONFIG
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: cloudops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - type: bind
        source: ./observability/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus_data
        target: /prometheus
  #GRAFANA CONFIG
  grafana:
    image: grafana/grafana:13.1.3
    container_name: cloudops-grafana
    ports:
      - "3000:3000"
    volumes:
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
  #TEMPO CONFIG
  tempo:
    image: grafana/tempo:3.0.0
    container_name: cloudops-tempo
    command:
      - "-config.file=/etc/tempo.yml"
    ports:
      - "3200:3200"
    volumes:
      - type: bind
        source: ./observability/tempo.yml
        target: /etc/tempo.yml
        read_only: true
      - type: volume
        source: tempo_data
        target: /var/tempo
  #LOKI CONFIG
  loki:
    image: grafana/loki:3.7.0
    container_name: cloudops-loki
    command:
      - "--config.file=/mnt/config/loki.yml"
    ports:
      - "3100:3100"
    volumes:
      - type: bind
        source: ./observability/loki.yml
        target: /mnt/config/loki.yml
        read_only: true
      - type: volume
        source: loki_data
        target: /tmp/loki
    depends_on:
      loki-init:
        condition: service_completed_successfully
  #Initializes the Loki volume for the non-root user 10001
  loki-init:
    image: busybox:1.37.0
    container_name: cloudops-loki-init
    user: "0"
    command:
      - "sh"
      - "-c"
      - "chown -R 10001:10001 /tmp/loki"
    volumes:
      - type: volume
        source: loki_data
        target: /tmp/loki
  #ALLOY CONFIG
  alloy:
    image: grafana/alloy:v1.18.1
    container_name: cloudops-alloy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    ports:
      - "12345:12345"
    volumes:
      - type: bind
        source: ./observability/alloy.alloy
        target: /etc/alloy/config.alloy
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: volume
        source: alloy_data
        target: /var/lib/alloy/data
    depends_on:
      - loki

#VOLUMES
volumes:
  qdrant_storage:
    name: qdrant_storage
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data
  tempo_data:
    name: tempo_data
  loki_data:
    name: loki_data
  alloy_data:
    name: alloy_data